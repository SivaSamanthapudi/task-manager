<div class="row align-items-end mt-2 mb-2 m-1">
    <div class="col">
        <h3 class="fw-bold">Groups</h3>
    </div>
    <div class="col-auto d-flex gap-3">
        <button class="btn btn-secondary shadow-sm" (click)="onAddGroup()">
            + Add New Group
        </button>
        <button class="btn btn-secondary shadow-sm" (click)="onAddExpense()">
            + Add New Expense
        </button>
    </div>
</div>
@if (groups().length>0) { <div class="m-3">
    <div class="row g-3">
        @for (group of groups(); track group.id; let i = $index) {
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">

                    <h6 class="card-title fw-bold">{{ group.title }}</h6>
                    <p class="card-text text-secondary">{{ group.description }}</p>

                    <div class="mt-auto pt-3 border-top">
                        <small class="d-block text-muted">
                            Created by: {{ userService.getUserNameById(group?.creator) }}
                        </small>
                        <small class="d-block text-muted">
                            <!-- Created on: {{ group.createdOn | date:'dd-MMM-yyyy' }} -->
                        </small>
                        <small class="d-block text-muted">
                            Currency: {{ group.currency }}
                        </small>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal"
                            data-bs-target="#editPostModal" (click)="onView(group)">
                            View
                        </button>

                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal"
                            data-bs-target="#editPostModal" (click)="onEdit(group)">
                            Edit
                        </button>

                        <button class="btn btn-outline-danger btn-sm" (click)="onDelete(group.id)">
                            Delete
                        </button>
                    </div>

                </div>
            </div>
        </div>
        }

    </div>
    <!-- <div class="mt-4">
        <app-pagination [totalItems]="totalCount()" [pageSize]="5" (pageChange)="onPageChanged($event)"
            (pageCountChange)="onCountChange($event)">
        </app-pagination>
    </div> -->

</div>

} @else {
<div class="text-center py-5">
    <p class="text-muted">No groups added yet!</p>
</div>
}
