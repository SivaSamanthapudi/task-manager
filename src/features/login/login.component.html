<div class="col-md-6 offset-md-3 mx-auto p-4">
  <form (submit)="onLogin(loginForm)" #loginForm="ngForm" novalidate>
    
    <div class="mb-3"> <label class="form-label">Email address</label>
      <input type="email" class="form-control" ngModel name="email" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" ngModel name="password" placeholder="Password">
    </div>

    <div class="mt-4 d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-link text-danger" (click)="onForgot()">
        Forgot password?
      </button>
    </div>
    
  </form>
</div>
