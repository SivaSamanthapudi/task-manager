<main class="container col-md-6 offset-md-3 mt-5 mx-auto">

    <form (submit)="onLogin(loginForm)" #loginForm="ngForm" novalidate>
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" class="form-control" ngModel name="email" aria-describedby="emailHelp"
                placeholder="Enter email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" ngModel name="password" placeholder="Password">
        </div>
        <!-- <div class="form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div> -->
        <div class="mt-3">

            <button type="submit" class="btn btn-primary float-start">Login</button>
            <button type="reset" class="btn btn-danger float-end" (click)="onForgot()">Forgot username/password?</button>
        </div>
    </form>

</main>
