<main class="container col-md-6 offset-md-3 mt-5 mx-auto">
  <form [formGroup]="registerForm">
    <div class="form-group">
      <label for="firstName">First Name:</label>
      <input
        type="text"
        class="form-control"
        formControlName="firstName"
        aria-describedby="nameHelp"
        placeholder="First name"
      />
    </div>
    <div class="form-group">
      <label for="lastName">Last Name:</label>
      <input
        type="text"
        class="form-control"
        formControlName="lastName"
        aria-describedby="nameHelp"
        placeholder="Last name"
      />
    </div>
    <div class="form-group">
      <label for="dateOfBirth" class="form-label">Date of birth:</label>
      <input type="date" formControlName="dateOfBirth" required class="form-control" />
    </div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input
        type="email"
        class="form-control"
        formControlName="email"
        aria-describedby="emailHelp"
        placeholder="Enter email"
      />
      <small name="emailHelp" class="form-text text-muted"
        >We'll never share your email with anyone else.</small
      >
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        class="form-control"
        formControlName="password"
        placeholder="Password"
      />
    </div>
    <!-- <div class="form-check">
        <input type="checkbox" class="form-check-input" name="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div> -->
    <div class="mt-3">
      <button type="submit" class="btn btn-primary float-start" (click)="onRegister()">
        Register
      </button>
      <button type="reset" class="btn btn-danger float-end">Reset</button>
    </div>
  </form>
</main>
