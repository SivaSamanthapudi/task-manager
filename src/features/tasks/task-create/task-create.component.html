<div class="modal-backdrop fade show"></div>

<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Task</h5>
        <button type="button" class="btn-close" (click)="close.emit()"></button>
      </div>
      <div class="modal-body">

        <form (submit)="onAddTask(postForm)" #postForm="ngForm" novalidate>
          <div class="mb-3">
            <label for="title" class="form-label">Title:</label>
            <input type="text" #title="ngModel" name="title" ngModel required minlength="3" class="form-control"
              id="title">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <textarea class="form-control" rows="4" name="description" ngModel required #content="ngModel"
              id="description" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="dueBy" class="form-label">Due by:</label>
            <input type="date" #title="ngModel" name="dueBy" ngModel required minlength="3" class="form-control"
              id="dueBy">
          </div>
          <div class="text-center">

            <button type="submit" class="btn btn-success ">Save</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
