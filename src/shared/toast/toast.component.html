<div class="toast-container position-fixed top-0 end-0 p-3">
  <div class="toast show">

    <div class="toast-header" [class]="bgClass()">
      <strong class="me-auto">{{ status }}</strong>

      <button type="button" class="btn-close ms-auto" aria-label="Close" (click)="onClose()">
      </button>
    </div>

    <div class="toast-body">
      {{ title }}
    </div>

  </div>
</div>
